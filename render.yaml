services:
  - type: web
    name: iutecp-asistente-virtual
    env: python
    buildCommand: pip install -r requirements.txt && python scripts/generate_documents.py
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: MODEL_PROVIDER
        value: gemini
